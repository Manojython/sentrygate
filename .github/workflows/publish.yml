name: publish

# Publishes sentrygate to PyPI with trusted publishing (OIDC), so no API token is
# stored anywhere. One-time setup: on PyPI, add a trusted publisher for the project
# "sentrygate" pointing at this repo, this workflow file and the "pypi" environment.
# After that, cutting a GitHub release builds and publishes on its own.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
